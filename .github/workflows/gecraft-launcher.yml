name: GeCraft Launcher 1.0 — Pre-release 1
on:
  push:
    branches: [main]
    paths:
      - "launcher-1.0/**"
      - ".github/workflows/gecraft-launcher.yml"
  pull_request:
    branches: [main]
    paths:
      - "launcher-1.0/**"
      - ".github/workflows/gecraft-launcher.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p launcher-1.0 :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeCraft-Launcher-1.0-pre1
          path: launcher-1.0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
