name: GeCraft Android Launcher — build from Amethyst

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gecraft-launcher.yml"
      - "gecraft/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GeCraft customization
        uses: actions/checkout@v4

      - name: Configure GitHub submodules to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout Amethyst (PojavLauncher-based engine)
        run: git clone --recursive --depth 1 --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git launcher-src

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Brand app as GeCraft
        run: sed -i 's/>Amethyst</>GeCraft</g' launcher-src/app_pojavlauncher/src/main/res/values/strings.xml

      - name: Build Android APK
        working-directory: launcher-src
        run: chmod +x gradlew && ./gradlew :app_pojavlauncher:assembleDebug

      - name: Upload GeCraft APK
        uses: actions/upload-artifact@v4
        with:
          name: GeCraft-Launcher-1.0-pre1
          path: launcher-src/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
