name: GeCraft Android Launcher — build from repository

# Keep only one active build for main; newer commits cancel stale runs.
concurrency:
  group: gecraft-android-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GeCraft source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 and JDK 8 (Gradle + legacy Java toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            8

      - name: Brand app as GeCraft
        run: |
          sed -i 's/>Amethyst</>GeCraft</g' app_pojavlauncher/src/main/res/values/strings.xml
          sed -i 's/Amethyst/GeCraft/g' app_pojavlauncher/src/main/assets/about_en.txt

      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          GRADLE_OPTS: -Dorg.gradle.java.installations.paths=${{ env.JAVA_HOME_8_X64 }},${{ env.JAVA_HOME_21_X64 }}
        run: chmod +x gradlew && ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload GeCraft APK
        uses: actions/upload-artifact@v4
        with:
          name: GeCraft-Launcher-1.0-pre1
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
